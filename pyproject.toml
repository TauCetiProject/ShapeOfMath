[project]
name = "the-shape-of-math"
version = "0.4.0"
description = "A small, revisable atlas of mathematical concepts and sources"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
embeddings = ["fastembed==0.9.1"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
mathdb = "mathdb:main"
mathdb-serve = "mathdb_server:main"
mathdb-discover = "discovery:main"
mathdb-import-plan = "curation_plans:main"
mathdb-task-usage = "task_usage:main"
mathdb-cohort = "cohorts:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mathdb", "mathdb_server", "discovery", "curation_plans", "task_usage", "pgcompat", "cohorts"]

[tool.setuptools.data-files]
"share/the-shape-of-math/prompts" = ["prompts/*.md"]
"share/the-shape-of-math/docs" = ["docs/DISCOVERY.md", "docs/CURATION_TASKS.md", "docs/CURATION.md", "docs/TASK_USAGE.md", "docs/SCALING.md", "docs/COHORTS.md"]
"share/the-shape-of-math/cohorts" = ["cohorts/*.json"]
"share/the-shape-of-math/discovery_examples" = ["discovery_examples/*.json"]
"share/the-shape-of-math" = ["schema.sql", "schema_pg.sql", "API.md"]
"share/the-shape-of-math/web" = ["web/index.html", "web/app.js", "web/cone.js", "web/math-text.js", "web/app.css"]
