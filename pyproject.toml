[project]
name = "the-shape-of-math"
version = "0.4.0"
description = "A small, revisable atlas of mathematical concepts and sources"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
embeddings = ["fastembed==0.9.1"]
openalex = ["pyarrow==26.0.1", "numpy==2.5.4"]

[project.scripts]
mathdb = "mathdb:main"
mathdb-serve = "mathdb_server:main"
mathdb-discover = "discovery:main"
mathdb-import-plan = "curation_plans:main"
mathdb-task-usage = "task_usage:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mathdb", "mathdb_server", "discovery", "curation_plans", "task_usage"]

[tool.setuptools.data-files]
"share/the-shape-of-math/prompts" = ["prompts/*.md"]
"share/the-shape-of-math/docs" = ["docs/DISCOVERY.md", "docs/CURATION_TASKS.md", "docs/CURATION.md", "docs/TASK_USAGE.md"]
"share/the-shape-of-math/discovery_examples" = ["discovery_examples/*.json"]
"share/the-shape-of-math/experiments/curation-2015-round2/overlap" = ["experiments/curation-2015-round2/overlap/*.html", "experiments/curation-2015-round2/overlap/*.js", "experiments/curation-2015-round2/overlap/*.json", "experiments/curation-2015-round2/overlap/*.csv", "experiments/curation-2015-round2/overlap/*.md", "experiments/curation-2015-round2/overlap/*.png", "experiments/curation-2015-round2/overlap/*.svg", "experiments/curation-2015-round2/overlap/*.pdf"]
