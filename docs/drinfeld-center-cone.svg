<svg class="cone-svg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="All 16 concepts in the prerequisite cone" data-world-width="780" data-world-height="1150" data-root-x="280" data-root-y="24" viewBox="0 0 780 1150" width="780" height="1150"><defs><marker id="cone-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#91a88a"/></marker></defs><g class="cone-world"><path class="cone-edge" data-edge-id="152" d="M 390 252 C 390 233, 268 233, 268 214" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Monoidal category → Braided monoidal category: Braided monoidal category uses Monoidal category in its definition or the chosen proof.</title></path><path class="cone-edge" data-edge-id="290" d="M 390 252 C 390 233, 512 233, 512 214" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Monoidal category → Half-braiding: Half-braiding uses Monoidal category in its definition or the chosen proof.</title></path><path class="cone-edge" data-edge-id="291" d="M 512 138 C 512 119, 390 119, 390 100" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Half-braiding → Drinfeld center of a monoidal category: Drinfeld center uses Half-braiding in its definition or the chosen proof.</title></path><path class="cone-edge" data-edge-id="292" d="M 268 138 C 268 119, 390 119, 390 100" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Braided monoidal category → Drinfeld center of a monoidal category: Drinfeld center uses Braided monoidal category in its definition or the chosen proof.</title></path><path class="cone-edge" data-edge-id="412" d="M 390 1050 C 390 1031, 512 1031, 512 1012" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Set → Function between sets: function requires set in the selected definition or proof. Use the assignment description, rather than requiring a set-theoretic encoding of its graph.</title></path><path class="cone-edge" data-edge-id="413" d="M 512 936 C 512 917, 512 917, 512 898" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Function between sets → Composition of functions: function-composition requires function in the selected definition or proof. </title></path><path class="cone-edge" data-edge-id="414" d="M 390 1050 C 390 1031, 268 1031, 268 1012" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Set → Ordered pair: ordered-pair requires set in the selected definition or proof. </title></path><path class="cone-edge" data-edge-id="415" d="M 268 936 C 268 917, 268 917, 268 898" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Ordered pair → Cartesian product of sets: cartesian-product requires ordered-pair in the selected definition or proof. </title></path><path class="cone-edge" data-edge-id="449" d="M 512 822 C 512 803, 390 803, 390 784" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Composition of functions → Category: category requires function-composition in the selected definition or proof. Composition is defined on pairs of composable morphisms, not a single everywhere-defined operation on all arrows. Size conventions are suppressed in this experiment.</title></path><path class="cone-edge" data-edge-id="450" d="M 268 822 C 268 803, 390 803, 390 784" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Cartesian product of sets → Category: category requires cartesian-product in the selected definition or proof. Composition is defined on pairs of composable morphisms, not a single everywhere-defined operation on all arrows. Size conventions are suppressed in this experiment.</title></path><path class="cone-edge" data-edge-id="451" d="M 390 708 C 390 632, 390 632, 390 556" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Category → Isomorphism in a category: isomorphism-in-category requires category in the selected definition or proof. </title></path><path class="cone-edge" data-edge-id="452" d="M 390 708 C 390 689, 390 689, 390 670" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Category → Functor: functor requires category in the selected definition or proof. </title></path><path class="cone-edge" data-edge-id="454" d="M 390 594 C 390 575, 634 575, 634 556" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Functor → Natural transformation: natural-transformation requires functor in the selected definition or proof. </title></path><path class="cone-edge" data-edge-id="455" d="M 634 480 C 634 461, 512 461, 512 442" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Natural transformation → Natural isomorphism: natural-isomorphism requires natural-transformation in the selected definition or proof. </title></path><path class="cone-edge" data-edge-id="456" d="M 390 480 C 390 461, 512 461, 512 442" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Isomorphism in a category → Natural isomorphism: natural-isomorphism requires isomorphism-in-category in the selected definition or proof. </title></path><path class="cone-edge" data-edge-id="457" d="M 390 708 C 390 632, 146 632, 146 556" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Category → Product of categories: product-category requires category in the selected definition or proof. </title></path><path class="cone-edge" data-edge-id="459" d="M 146 480 C 146 461, 268 461, 268 442" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Product of categories → Bifunctor: bifunctor requires product-category in the selected definition or proof. </title></path><path class="cone-edge" data-edge-id="460" d="M 390 594 C 390 518, 268 518, 268 442" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Functor → Bifunctor: bifunctor requires functor in the selected definition or proof. </title></path><path class="cone-edge" data-edge-id="461" d="M 268 366 C 268 347, 390 347, 390 328" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Bifunctor → Monoidal category: monoidal-category requires bifunctor in the selected definition or proof. The pentagon and triangle equations are part of this definition; a coherence theorem is not needed to state it.</title></path><path class="cone-edge" data-edge-id="462" d="M 512 366 C 512 347, 390 347, 390 328" fill="none" stroke="#a8b9a0" stroke-width="1.4" marker-end="url(#cone-arrow)"><title>Natural isomorphism → Monoidal category: monoidal-category requires natural-isomorphism in the selected definition or proof. The pentagon and triangle equations are part of this definition; a coherence theorem is not needed to state it.</title></path><a class="cone-node cone-root" data-concept-id="a0d843ee-b6d1-5801-8721-9a977f907ed3" href="http://127.0.0.1:8000/#concept/drinfeld-center?view=cone" aria-label="Drinfeld center of a monoidal category"><title>Drinfeld center of a monoidal category
For a monoidal category C, its center Z(C) has objects (X,c), where c is a half-braiding on X, and morphisms f:X→X′ compatible with the half-braidings. Tensoring these pairs makes Z(C) braided; C itself need not be braided.
Immediate prerequisites reviewed</title><rect x="280" y="24" width="220" height="76" rx="7" fill="#184b40" stroke="#184b40" stroke-width="1.3"/><circle cx="488" cy="36" r="3" fill="#d1e2cf"/><text x="292" y="46" fill="#fffefb" font-family="system-ui, sans-serif" font-size="11">Drinfeld center of a monoidal</text><text x="292" y="60" fill="#fffefb" font-family="system-ui, sans-serif" font-size="11">category</text><text x="292" y="89" fill="#bad0c0" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="32a27433-eb68-5ae7-aac1-7d61e5d6194d" href="http://127.0.0.1:8000/#concept/half-braiding?view=cone" aria-label="Half-braiding"><title>Half-braiding
For an object X of a monoidal category C, a natural family of isomorphisms c_Y:X⊗Y→Y⊗X, compatible with tensor products and the unit: c_{Y⊗Z}=(id_Y⊗c_Z)∘(c_Y⊗id_Z), with associators inserted.
Immediate prerequisites reviewed</title><rect x="402" y="138" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="610" cy="150" r="3" fill="#73936b"/><text x="414" y="160" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Half-braiding</text><text x="414" y="203" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="a55794ca-1374-5e97-921e-99a51e88aba2" href="http://127.0.0.1:8000/#concept/braided-category?view=cone" aria-label="Braided monoidal category"><title>Braided monoidal category
A monoidal category with natural isomorphisms c(X,Y):X⊗Y→Y⊗X satisfying the two hexagon identities.
Immediate prerequisites reviewed</title><rect x="158" y="138" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="366" cy="150" r="3" fill="#73936b"/><text x="170" y="160" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Braided monoidal category</text><text x="170" y="203" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="ab935768-7ed2-57c2-b9a7-acd367126106" href="http://127.0.0.1:8000/#concept/monoidal-category?view=cone" aria-label="Monoidal category"><title>Monoidal category
A category C with a tensor bifunctor C×C→C, a unit object, and natural associativity and unit isomorphisms satisfying the pentagon and triangle identities.
Immediate prerequisites reviewed</title><rect x="280" y="252" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="488" cy="264" r="3" fill="#73936b"/><text x="292" y="274" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Monoidal category</text><text x="292" y="317" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="fe484b1e-fb3b-5990-8f1f-d091e7992da0" href="http://127.0.0.1:8000/#concept/bifunctor?view=cone" aria-label="Bifunctor"><title>Bifunctor
A functor C×D→E from a product of two categories to another category.
Immediate prerequisites reviewed</title><rect x="158" y="366" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="366" cy="378" r="3" fill="#73936b"/><text x="170" y="388" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Bifunctor</text><text x="170" y="431" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="7c267857-2d37-5db9-bb1f-7fba565fa6ee" href="http://127.0.0.1:8000/#concept/natural-isomorphism?view=cone" aria-label="Natural isomorphism"><title>Natural isomorphism
A natural transformation whose component at every object is an isomorphism.
Immediate prerequisites reviewed</title><rect x="402" y="366" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="610" cy="378" r="3" fill="#73936b"/><text x="414" y="388" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Natural isomorphism</text><text x="414" y="431" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="4d8db4ed-f3e9-5880-b043-3ce69ab8c490" href="http://127.0.0.1:8000/#concept/product-category?view=cone" aria-label="Product of categories"><title>Product of categories
C×D has pairs of objects and pairs of morphisms, with identities and composition defined componentwise.
Immediate prerequisites reviewed</title><rect x="36" y="480" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="244" cy="492" r="3" fill="#73936b"/><text x="48" y="502" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Product of categories</text><text x="48" y="545" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="c462e5e3-887b-5306-84bf-57d822bda2b2" href="http://127.0.0.1:8000/#concept/functor?view=cone" aria-label="Functor"><title>Functor
A map of categories preserving objects, morphisms, identities and composition.
Immediate prerequisites reviewed</title><rect x="280" y="594" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="488" cy="606" r="3" fill="#73936b"/><text x="292" y="616" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Functor</text><text x="292" y="659" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="22fe3268-6fa6-5eae-84db-7e252ba2d47f" href="http://127.0.0.1:8000/#concept/natural-transformation?view=cone" aria-label="Natural transformation"><title>Natural transformation
A family of maps between the values of two functors, commuting with every morphism in their source category.
Immediate prerequisites reviewed</title><rect x="524" y="480" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="732" cy="492" r="3" fill="#73936b"/><text x="536" y="502" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Natural transformation</text><text x="536" y="545" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="4043987a-1604-5d00-8a93-7199063fcbd7" href="http://127.0.0.1:8000/#concept/isomorphism-in-category?view=cone" aria-label="Isomorphism in a category"><title>Isomorphism in a category
A morphism f:X→Y having an inverse g:Y→X, so gf=id_X and fg=id_Y.
Immediate prerequisites reviewed</title><rect x="280" y="480" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="488" cy="492" r="3" fill="#73936b"/><text x="292" y="502" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Isomorphism in a category</text><text x="292" y="545" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="8c3ec461-9854-5c3b-885b-60bdd5aadb51" href="http://127.0.0.1:8000/#concept/category?view=cone" aria-label="Category"><title>Category
Objects and morphisms with associative composition and identity morphisms.
Immediate prerequisites reviewed</title><rect x="280" y="708" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="488" cy="720" r="3" fill="#73936b"/><text x="292" y="730" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Category</text><text x="292" y="773" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="522e16f3-1599-5bfb-8971-a8807d19a2a0" href="http://127.0.0.1:8000/#concept/function-composition?view=cone" aria-label="Composition of functions"><title>Composition of functions
For f:A→B and g:B→C, the composite g∘f:A→C sends x to g(f(x)).
Immediate prerequisites reviewed</title><rect x="402" y="822" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="610" cy="834" r="3" fill="#73936b"/><text x="414" y="844" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Composition of functions</text><text x="414" y="887" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="bd78c7f9-1f92-5b92-8936-3c2fcc09a79a" href="http://127.0.0.1:8000/#concept/cartesian-product?view=cone" aria-label="Cartesian product of sets"><title>Cartesian product of sets
A×B is the set of ordered pairs (a,b) with a∈A and b∈B.
Immediate prerequisites reviewed</title><rect x="158" y="822" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="366" cy="834" r="3" fill="#73936b"/><text x="170" y="844" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Cartesian product of sets</text><text x="170" y="887" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="9f7d1206-4b3b-5dc1-8a9a-7f5c5713846f" href="http://127.0.0.1:8000/#concept/function?view=cone" aria-label="Function between sets"><title>Function between sets
An assignment taking each element of a specified domain set to exactly one element of a specified codomain set.
Immediate prerequisites reviewed</title><rect x="402" y="936" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="610" cy="948" r="3" fill="#73936b"/><text x="414" y="958" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Function between sets</text><text x="414" y="1001" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="6e178eaa-1798-5087-a3c9-4e718f73b608" href="http://127.0.0.1:8000/#concept/ordered-pair?view=cone" aria-label="Ordered pair"><title>Ordered pair
A pair (x,y) with distinguished first and second entries; (x,y)=(x′,y′) exactly when x=x′ and y=y′.
Immediate prerequisites reviewed</title><rect x="158" y="936" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="366" cy="948" r="3" fill="#73936b"/><text x="170" y="958" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Ordered pair</text><text x="170" y="1001" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a><a class="cone-node" data-concept-id="58ce6e80-a18d-59aa-8ed6-1a2c771a31a3" href="http://127.0.0.1:8000/#concept/set?view=cone" aria-label="Set"><title>Set
A collection of distinct elements, regarded as one object.
Immediate prerequisites reviewed</title><rect x="280" y="1050" width="220" height="76" rx="7" fill="#fffefb" stroke="#c3d2bc" stroke-width="1.3"/><circle cx="488" cy="1062" r="3" fill="#73936b"/><text x="292" y="1072" fill="#263c35" font-family="system-ui, sans-serif" font-size="11">Set</text><text x="292" y="1115" fill="#7b8476" font-family="system-ui, sans-serif" font-size="8.5">definition · reviewed</text></a></g></svg>